name: release

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch as a fallback when GitHub misses a tag push event.
  # Observed 2026-04-23 with v0.6.1: `git push origin v0.6.1` succeeded,
  # tag present on remote, but no CreateEvent / workflow trigger fired
  # even after delete+re-push. Dispatch from a tag ref with:
  #   gh workflow run release.yml --ref v0.6.1
  # GITHUB_REF_NAME resolves to the tag name, so the existing release-body
  # logic (`TAG="${GITHUB_REF_NAME}"`) keeps working unchanged.
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm
      # OIDC trusted publishing needs npm >= 11.5.1; setup-node with Node 20
      # ships npm 10.x, which fails the exchange with an unhelpful message.
      #
      # Pinned to the 11 line, not `npm@latest`. npm 12 requires
      # node ^22.22.2 || ^24.15.0 || >=26.0.0 and this job runs Node 20, so
      # `npm@latest` fails EBADENGINE before reaching the publish step — it did,
      # on the first dispatch after this step was introduced. npm 11.19.0 asks
      # for ^20.17.0 || >=22.9.0 and clears the 11.5.1 floor. Raising this pin
      # means raising `node-version` above with it.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run generate
      - run: npm run build
      # No NODE_AUTH_TOKEN: authentication comes from the OIDC token minted by
      # `id-token: write` above, against the trusted publisher configured on
      # npmjs.com for this repository and this workflow filename. Renaming this
      # file, or moving the publish step to another workflow, breaks publishing
      # until the npm-side configuration is updated to match.
      - run: npm publish --provenance --access public

  publish-docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [publish-npm, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release notes."
